name: dusklight-online-relay

services:
  vpn:
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Europe/London}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WIREGUARD_PRIVATE_KEY:?Set this in Dockge}
      SERVER_COUNTRIES: ${PROTON_SERVER_COUNTRIES:-United Kingdom}
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
    configs:
      - source: gluetun_relay_auth
        target: /gluetun/auth/config.toml
        mode: 0444

  relay:
    image: dusklight-online-relay:${RELAY_VERSION:?Set this in Dockge}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELAY_VERSION: ${RELAY_VERSION:?Set this in Dockge}
    pull_policy: never
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      GLUETUN_CONTROL_URL: http://127.0.0.1:8000
      GLUETUN_POLL_SECONDS: ${GLUETUN_POLL_SECONDS:-15}
      RELAY_VERBOSE: ${RELAY_VERBOSE:-off}
    stop_grace_period: 10s

configs:
  gluetun_relay_auth:
    content: |
      [[roles]]
      name = "dusklight-relay"
      routes = ["GET /v1/portforward", "GET /v1/publicip/ip"]
      auth = "none"
